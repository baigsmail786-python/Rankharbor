name: Move temp index into place
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temporary file to index.html
        run: |
          test -f seo-agency-website.html
          mv seo-agency-website.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace index.html with patched version (scroll restoration fix)"
          git push
