name: Temp Move Homepage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move temp homepage to index.html
        run: |
          git config user.name "baigsmail786-python"
          git config user.email "baigsmail786@gmail.com"
          mv seo-agency-website.html _temp-homepage.html
          mv -f _temp-homepage.html index.html
          git add -A
          git commit -m "Publish new RankHarbor homepage"
          git push
