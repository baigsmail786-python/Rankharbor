name: Move homepage to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move uploaded homepage to index.html
        run: |
          set -e
          test -f seo-agency-website.html
          mv -f seo-agency-website.html index.html
          ls -l index.html
          grep -F "rankharbor67@gmail.com" index.html
          grep -F "25,000" index.html
      - name: Commit move
        run: |
          git config user.name "baigsmail786-python"
          git config user.email "baigsmail786-python@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Update RankHarbor: approved prices + rankharbor67 contact email"
          git push
