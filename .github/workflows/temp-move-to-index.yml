name: Move rh-index-new.html to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temporary file to index.html
        run: |
          mv rh-index-new.html index.html
          git config user.name "baigsmail786-python"
          git config user.email "baigsmail786-python@users.noreply.github.com"
          git add index.html rh-index-new.html
          git commit -m "Update index.html from rh-index-new.html" || echo "No changes to commit"
          git push
